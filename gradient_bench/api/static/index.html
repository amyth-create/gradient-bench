      // Theme is applied before first paint so there is no flash. The choice
      // is per browser; "system" stamps nothing and lets prefers-color-scheme
      // decide, which is the product's default.
      try {
        var t = localStorage.getItem('gb2.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
